spring:
  application:
    name: gat2027-grassroot
  datasource:
    # Default: embedded H2 file database in PostgreSQL mode (zero configuration for local development).
    # Set DATABASE_URL (Railway / local PostgreSQL) to use PostgreSQL instead - see config/DataSourceConfig.
    url: jdbc:h2:file:./data/gat;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 500
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  h2:
    console:
      enabled: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8084}
  forward-headers-strategy: framework
  compression:
    enabled: true
  error:
    include-message: always
  tomcat:
    max-http-form-post-size: 210MB
    max-swallow-size: 210MB

management:
  endpoints:
    web:
      exposure:
        include: health

gat:
  admin:
    phone: ${GAT_ADMIN_PHONE:08000000000}
    password: ${GAT_ADMIN_PASSWORD:admin1234}
  import:
    csv: ${POLLING_UNITS_CSV:classpath:data/polling-units.csv}
    on-startup: ${GAT_IMPORT_ON_STARTUP:true}
  remember-me-key: ${GAT_REMEMBER_KEY:gat2027-forward-together}
  mail:
    from: ${MAIL_FROM:GAT 2027 <no-reply@gat2027.ng>}

logging:
  level:
    org.flywaydb: info
    org.hibernate.SQL: warn
