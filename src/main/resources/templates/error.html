<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/site :: pageHead('Error')}"></th:block></head>
<body>
<th:block th:replace="~{fragments/site :: siteHeader('')}"></th:block>
<main class="container narrow" style="max-width:560px">
  <div class="card">
    <h1 th:text="${status == 404} ? 'Page not found' : 'Something went wrong'">Error</h1>
    <p class="muted" th:text="${status == 404} ? 'The page you asked for does not exist.' : ('Error ' + ${status} + (${message} != null ? ': ' + ${message} : ''))"></p>
    <a class="btn" href="/">Back to home</a>
  </div>
</main>
<th:block th:replace="~{fragments/site :: siteFooter(false)}"></th:block>
</body>
</html>
