<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/site :: pageHead('Reset password')}"></th:block></head>
<body>
<th:block th:replace="~{fragments/site :: siteHeader('/login')}"></th:block>
<main class="container narrow" style="max-width:460px">
  <div class="card">
    <h1>Set a new password</h1>
    <div th:if="${!valid}">
      <div class="alert error">This reset link is invalid or has expired.</div>
      <p class="muted"><a href="/forgot-password">Request a new reset link</a>.</p>
    </div>
    <div th:if="${valid}">
      <div class="alert error" th:if="${error}" th:text="${error}"></div>
      <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <div class="field"><label>New password</label><input name="password" type="password" required minlength="6" autocomplete="new-password"></div>
        <div class="field" style="margin-top:.8rem"><label>Confirm new password</label><input name="password2" type="password" required minlength="6" autocomplete="new-password"></div>
        <button class="btn" type="submit" style="width:100%;margin-top:1rem">Set new password</button>
      </form>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/site :: siteFooter(false)}"></th:block>
</body>
</html>
