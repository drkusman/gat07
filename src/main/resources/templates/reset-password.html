<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/site :: pageHead('Reset password')}"></th:block></head>
<body>
<th:block th:replace="~{fragments/site :: siteHeader('/login')}"></th:block>
<main class="container narrow" style="max-width:460px">
  <div class="card">
    <h1>Set a new password</h1>
    <div th:if="${!valid}">
      <div class="alert error">This reset link is invalid or has expired.</div>
      <p class="muted"><a href="/forgot-password">Request a new reset link</a>.</p>
    </div>
    <div th:if="${valid}">
      <div class="alert error" th:if="${error}" th:text="${error}"></div>
      <form id="resetForm" th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <div class="field"><label>New password</label><input id="rpPassword" name="password" type="password" required minlength="6" autocomplete="new-password"></div>
        <div class="field" style="margin-top:.8rem"><label>Confirm new password</label><input id="rpPassword2" name="password2" type="password" required minlength="6" autocomplete="new-password"></div>
        <p id="rpMismatch" class="small" style="color:var(--red);margin:.4rem 0 0;display:none">Passwords do not match</p>
        <button id="rpSubmit" class="btn" type="submit" style="width:100%;margin-top:1rem" disabled>Set new password</button>
      </form>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/site :: siteFooter(false)}"></th:block>
<script th:if="${valid}">
(function () {
  var p1 = document.getElementById('rpPassword'), p2 = document.getElementById('rpPassword2');
  var mismatch = document.getElementById('rpMismatch'), submit = document.getElementById('rpSubmit');
  function check() {
    var bothFilled = p1.value.length >= 6 && p2.value.length >= 6;
    var match = p1.value === p2.value;
    mismatch.style.display = (p2.value.length > 0 && !match) ? 'block' : 'none';
    submit.disabled = !(bothFilled && match);
  }
  p1.addEventListener('input', check);
  p2.addEventListener('input', check);
})();
</script>
</body>
</html>
