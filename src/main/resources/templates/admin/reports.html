<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shell :: layout(~{::#page})}">
<body>
<div id="page">
  <div th:replace="~{fragments/adminfilter :: bar}"></div>
  <div class="panel">
    <div class="ph"><h2>Field reports</h2>
      <div class="act subtabs">
        <a th:each="t : ${ {'OPEN','REVIEWED','CLOSED',''} }" th:href="@{/admin/reports} + ${filter.qsWith('status', t)}" class="subtab" th:classappend="${t == status} ? 'active'" th:text="${t == ''} ? 'All' : ${#strings.capitalize(#strings.toLowerCase(t))}" style="display:inline-block;border:1px solid var(--line);background:#fff;padding:.4rem .8rem;border-radius:999px;font-size:.82rem;font-weight:600;color:var(--muted);text-decoration:none"></a>
      </div></div>
    <div class="pb flush">
      <div class="report-item" th:each="r : ${rows}">
        <div class="rh"><span class="pill" th:classappend="${r.category() == 'INCIDENT' or r.category() == 'COMPLAINT'} ? 'red' : 'blue'" th:text="${T(ng.gat2027.grassroot.domain.ReportCategory).valueOf(r.category()).label}"></span>
          <span class="pill" th:classappend="${r.status() == 'OPEN'} ? 'gold' : (${r.status() == 'REVIEWED'} ? 'blue' : 'grey')" th:text="${#strings.toLowerCase(r.status())}"></span>
          <b th:text="${r.title()}"></b><time th:text="${#temporals.format(r.createdAt(), 'd MMM yyyy, HH:mm')}"></time></div>
        <p th:text="${r.body()}"></p>
        <div class="meta">By <span th:text="${r.memberName()}"></span> (<span th:text="${r.memberCode()}"></span>, <span th:text="${r.phone()}"></span>) · <span th:text="${r.location()}"></span>
          <th:block th:if="${r.lat() != null}"> · <a target="_blank" rel="noopener" th:href="'https://www.google.com/maps?q=' + ${r.lat()} + ',' + ${r.lng()}">GPS</a></th:block></div>
        <form th:action="@{/admin/reports/{id}(id=${r.id()})}" method="post" class="btn-row no-print" style="margin-top:.7rem">
          <input type="hidden" name="back" th:value="${filter.qs()}">
          <input name="adminNote" placeholder="Coordinator note" th:value="${r.adminNote()}" style="max-width:380px">
          <select name="status" style="width:auto"><option value="OPEN" th:selected="${r.status() == 'OPEN'}">open</option><option value="REVIEWED" th:selected="${r.status() == 'REVIEWED'}">reviewed</option><option value="CLOSED" th:selected="${r.status() == 'CLOSED'}">closed</option></select>
          <button class="btn sm">Save</button></form>
      </div>
      <div class="empty" th:if="${rows.isEmpty()}"><span class="big">▤</span>No reports in this selection.</div>
    </div>
  </div>
  <style>.subtab.active{background:var(--green-dark)!important;border-color:var(--green-dark)!important;color:#fff!important}</style>
</div>
</body>
</html>
