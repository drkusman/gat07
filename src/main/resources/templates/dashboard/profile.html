<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shell :: layout(~{::#page})}">
<body>
<div id="page">
  <form id="profileForm" th:action="@{/dashboard/profile}" th:object="${form}" method="post"
        th:attr="data-zone=*{zoneId},data-state=*{stateId},data-lga=*{lgaId},data-ward=*{wardId},data-pu=*{pollingUnitId}">
    <div class="panel">
      <div class="ph"><h2>Biodata</h2><span class="sub">Keep your details up to date</span></div>
      <div class="pb form-grid">
        <div class="field"><label>First name</label><input th:field="*{firstName}" required></div>
        <div class="field"><label>Surname</label><input th:field="*{lastName}" required></div>
        <div class="field"><label>Other name</label><input th:field="*{otherName}"></div>
        <div class="field"><label>Gender</label><select th:field="*{gender}"><option value="">Select</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
        <div class="field"><label>Date of birth</label><input th:field="*{dob}" type="date" th:max="${ageRules.maxDob()}" th:required="${ageRules.requireDob()}"><span class="help">Members must be at least <span th:text="${ageRules.minAge()}">16</span> years old.</span></div>
        <div class="field"><label>Phone</label><input th:field="*{phone}" type="tel" required></div>
        <div class="field"><label>Email</label><input th:field="*{email}" type="email"></div>
        <div class="field"><label>Occupation</label><input th:field="*{occupation}" maxlength="200"></div>
        <div class="field"><label>Education</label><select th:field="*{education}"><option value="">Select</option><option value="Primary">Primary</option><option value="Secondary">Secondary</option><option value="OND/NCE">OND/NCE</option><option value="HND/Bachelor's">HND/Bachelor's</option><option value="Master's">Master's</option><option value="Doctorate">Doctorate</option><option value="Other">Other</option></select></div>
        <div class="field"><label>Voter Identification Number</label><input th:field="*{vin}"></div>
        <div class="field full"><label>Residential address</label><input th:field="*{address}"></div>
        <div class="field full"><label>Passport photograph</label><div class="profile-strip"><img id="ephotoPreview" th:src="${me.photo}" th:classappend="${me.photo == null} ? 'hidden'" alt=""><input type="file" id="ephoto" accept="image/*"></div><input type="hidden" th:field="*{photo}"></div>
      </div>
    </div>
    <div class="panel" id="location" style="margin-top:1.1rem">
      <div class="ph"><h2>Polling unit &amp; GPS</h2><span class="sub">Change only if you were registered at the wrong unit</span></div>
      <div class="pb">
        <div class="form-grid">
          <div class="field"><label>Zone</label><select id="ezone" name="zoneId"></select></div>
          <div class="field"><label>State</label><select id="estate" name="stateId" disabled></select></div>
          <div class="field"><label>LGA</label><select id="elga" name="lgaId" disabled></select></div>
          <div class="field"><label>Ward</label><select id="eward" name="wardId" disabled></select></div>
          <div class="field full hidden" id="enewWard"><div class="form-grid"><div class="field"><label>Ward name</label><input th:field="*{newWardName}"></div><div class="field"><label>Ward code</label><input th:field="*{newWardCode}"></div></div></div>
          <div class="field full"><label>Polling unit</label><select id="epu" name="pollingUnitId" disabled></select></div>
          <div class="field full hidden" id="enewPu"><div class="form-grid"><div class="field"><label>Polling unit name</label><input th:field="*{newPuName}"></div><div class="field"><label>PU code</label><input th:field="*{newPuCode}"></div></div></div>
        </div>
        <div class="btn-row" style="margin:.8rem 0 .5rem"><button type="button" class="btn blue sm" id="elocate">📍 Use my current location</button><span class="muted small">or click the map / type the coordinates</span></div>
        <div id="editMap" class="map" style="height:280px"></div>
        <div class="form-grid" style="margin-top:.6rem">
          <div class="field"><label>Latitude</label><input th:field="*{puLatitude}" id="elat" type="number" step="any"></div>
          <div class="field"><label>Longitude</label><input th:field="*{puLongitude}" id="elng" type="number" step="any"></div>
        </div>
      </div>
    </div>
    <div class="btn-row" style="margin-top:1rem"><button class="btn" type="submit">Save changes</button></div>
  </form>
  <div class="panel" style="margin-top:1.1rem">
    <div class="ph"><h2>Change password</h2></div>
    <form th:action="@{/dashboard/profile/password}" method="post" class="pb form-grid">
      <div class="field"><label>Current password</label><input name="currentPassword" type="password" required></div>
      <div class="field"><label>New password</label><input name="newPassword" type="password" minlength="6" required></div>
      <div class="field" style="justify-content:flex-end"><button class="btn secondary" type="submit">Update password</button></div>
    </form>
  </div>
  <script>document.addEventListener("DOMContentLoaded", () => GAT.profilePage());</script>
</div>
</body>
</html>
