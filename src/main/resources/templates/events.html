<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/site :: pageHead('Events')}"></th:block></head>
<body>
<th:block th:replace="~{fragments/site :: siteHeader('/events')}"></th:block>

<main class="container">
  <div class="card" style="margin-bottom:1.5rem">
    <h2 style="text-align:center">Events</h2>
    <p class="muted" style="text-align:center;margin-top:-.3rem">Rallies, town halls and mobilisation drives from across the country.</p>
  </div>
  <div class="card" style="margin-bottom:1.5rem" th:if="${galleryTabs.size() > 0}">
    <h2 style="text-align:center">Photo Gallery</h2>
    <div class="gallery-tabs">
      <button type="button" th:each="tab, tabStat : ${galleryTabs}" class="gallery-tab" th:classappend="${tabStat.first} ? 'active'"
              th:attr="data-target=|gallery-${tab.event().id}|" th:text="${tab.event().title}"></button>
    </div>
    <div th:each="tab, tabStat : ${galleryTabs}" class="slideshow gallery-panel" th:id="|gallery-${tab.event().id}|"
         th:style="${tabStat.first} ? '' : 'display:none'">
      <div class="slide" th:each="p, pStat : ${tab.photos()}" th:classappend="${pStat.first} ? 'active'">
        <img th:src="${p.imageData}" th:alt="|${tab.event().title} — photo ${pStat.count}|" loading="lazy">
      </div>
      <button type="button" class="slide-nav prev" aria-label="Previous photo">&#10094;</button>
      <button type="button" class="slide-nav next" aria-label="Next photo">&#10095;</button>
      <div class="slide-dots">
        <span class="dot" th:each="p, pStat : ${tab.photos()}" th:classappend="${pStat.first} ? 'active'" th:attr="data-i=${pStat.index}"></span>
      </div>
      <div class="slide-caption" th:text="${tab.event().title}"></div>
    </div>
  </div>
  <div th:if="${pastEvents.size() > 0}" style="margin-top:1rem">
    <h3>Past events</h3>
    <div class="grid cols-3">
      <th:block th:each="e : ${pastEvents}"><div th:replace="~{fragments/eventcard :: card(${e})}"></div></th:block>
    </div>
  </div>
  <div class="card" th:if="${upcomingEvents.size() == 0 and pastEvents.size() == 0}" style="margin-top:1rem;text-align:center">
    <span class="muted">No events published yet — check back soon.</span>
  </div>
</main>
<th:block th:replace="~{fragments/site :: siteFooter(true)}"></th:block>
<script>
(function () {
  var panels = document.querySelectorAll('.gallery-panel');
  var tabs = document.querySelectorAll('.gallery-tab');
  if (!panels.length) return;
  var states = {};

  panels.forEach(function (panel) {
    var slides = panel.querySelectorAll('.slide');
    var dots = panel.querySelectorAll('.dot');
    var state = { i: 0, timer: null };
    states[panel.id] = state;

    function show(n) {
      slides[state.i].classList.remove('active'); dots[state.i].classList.remove('active');
      state.i = (n + slides.length) % slides.length;
      slides[state.i].classList.add('active'); dots[state.i].classList.add('active');
    }
    state.restart = function () { clearInterval(state.timer); state.timer = setInterval(function () { show(state.i + 1); }, 5000); };
    state.stop = function () { clearInterval(state.timer); };

    panel.querySelector('.next').addEventListener('click', function () { show(state.i + 1); state.restart(); });
    panel.querySelector('.prev').addEventListener('click', function () { show(state.i - 1); state.restart(); });
    dots.forEach(function (d, idx) { d.addEventListener('click', function () { show(idx); state.restart(); }); });
  });

  function activate(id) {
    panels.forEach(function (p) {
      var active = p.id === id;
      p.style.display = active ? '' : 'none';
      if (active) states[p.id].restart(); else states[p.id].stop();
    });
    tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.target === id); });
  }

  tabs.forEach(function (t) { t.addEventListener('click', function () { activate(t.dataset.target); }); });
  activate(panels[0].id);
})();
</script>
</body>
</html>
