<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="card(e, showUpcomingTag)" class="event-card">
  <div class="event-cover">
    <span class="event-cover-ph">📅</span>
  </div>
  <div class="event-body">
    <span th:if="${showUpcomingTag} and ${e.upcoming}" class="event-tag">Upcoming</span>
    <h3 th:text="${e.title}"></h3>
    <div class="event-meta" th:text="${#temporals.format(e.eventDate, 'd MMM yyyy')} + (${e.location} != null ? ' · ' + ${e.location} : '')"></div>
    <p class="muted" th:text="${e.description}"></p>
    <div class="event-links">
      <span th:if="${!e.hasMedia()}" class="muted small" style="font-style:italic">Photos &amp; videos coming soon</span>
      <a th:if="${e.hasUploadedVideo()}" th:href="@{/events/{id}/video(id=${e.id})}" target="_blank" rel="noopener" class="event-link">▶ Watch video</a>
      <a th:if="${e.hasYoutubeUrl()}" th:href="${e.youtubeUrl}" target="_blank" rel="noopener" class="event-link">▶ Watch on YouTube</a>
    </div>
  </div>
</div>
</body>
</html>
