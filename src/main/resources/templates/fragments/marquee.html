<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="bar(items, label, linkUrl)">
  <div class="news-marquee" th:if="${!items.isEmpty()}">
    <span class="news-marquee-label" th:text="${label}">🔴 Breaking News</span>
    <div class="news-marquee-viewport">
      <div class="news-marquee-track" id="newsMarqueeTrack">
        <th:block th:each="pass : ${#numbers.sequence(1,2)}">
          <a class="news-marquee-item" th:each="a : ${items}" th:href="${linkUrl} ?: '#'" th:onclick="${linkUrl == null} ? 'return false' : null">
            <b th:text="${a.title}"></b><th:block th:if="${a.body != null and !a.body.isBlank()}"><span th:text="' — ' + ${a.body}"></span></th:block>
          </a>
        </th:block>
      </div>
    </div>
    <script>
    (function () {
      var track = document.getElementById('newsMarqueeTrack');
      if (!track) return;
      var pxPerSecond = 110;
      var distance = track.scrollWidth / 2;
      track.style.animationDuration = Math.max(6, distance / pxPerSecond) + 's';
    })();
    </script>
  </div>
</th:block>
</body>
</html>
