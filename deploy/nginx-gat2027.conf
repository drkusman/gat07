# Nginx reverse proxy for GAT 2027 (Amazon Linux 2023 layout - no sites-available/sites-enabled,
# nginx.conf just includes /etc/nginx/conf.d/*.conf).
# Install: sudo cp deploy/nginx-gat2027.conf /etc/nginx/conf.d/gat2027.conf
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see deployment steps) to add the HTTPS server block automatically.

server {
    listen 80;
    server_name gat2027.org.ng www.gat2027.org.ng;

    client_max_body_size 210m;  # matches server.tomcat.max-http-form-post-size in application.yml

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
